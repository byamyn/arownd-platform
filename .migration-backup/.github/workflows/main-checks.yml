name: Main branch checks

on:
  push:
    branches:
      - main
      - arownd-premium
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript, ESLint, Vitest and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm

      # npm 10.9.x has an Arborist peer-dependency resolver bug that can
      # crash with "Cannot read properties of null (reading 'edgesOut')".
      # Keep CI aligned with Vercel Node 26 and use a fixed npm release.
      - name: Set up npm 11
        run: |
          npm install --global npm@11.19.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        id: lint
        run: npm run lint

      # Keep collecting test/build diagnostics while the known formatting debt is resolved.
      # A lint failure still fails the job; this only prevents it from skipping later checks.
      - name: Arownd UI design-system lint
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: npm run ui:check

      - name: Vitest
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: npm test

      - name: Vercel production build
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        # CI-only placeholders validate bundling; never used for a deployment.
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-public-key
        run: npm run build:vercel

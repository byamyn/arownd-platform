name: Core stability checks

on:
  push:
    branches:
      - "stabilize/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint changed application files
        run: npx eslint 'src/routes/profile.tsx' 'src/routes/orders.$orderId.tsx' --rule '{"prettier/prettier":"off"}'

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

name: Core stability checks

on:
  push:
    branches:
      - "main"
      - "stabilize/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up npm 11
        run: |
          npm install --global npm@11.19.1
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Full-project ESLint
        id: lint
        run: npm run lint

      # Existing repository-wide formatting debt should not hide test/build results.
      # The job remains failed when lint fails, but validation continues for diagnosis.
      - name: Unit and integration tests
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: npm test

      - name: Production build
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: npm run build

      - name: Capacitor SPA shell build
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: npm run build:capacitor

      - name: Verify Capacitor web entry
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: test -s dist/client/index.html

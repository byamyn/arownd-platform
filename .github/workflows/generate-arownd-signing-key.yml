name: Generate Arownd Android Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate Arownd release keystore
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p signing-output
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore signing-output/arownd-release.jks \
            -storetype JKS \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias arownd \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Arownd, OU=Mobile, O=Arownd, L=Algeria, C=DZ"
          base64 -w 0 signing-output/arownd-release.jks > signing-output/KEYSTORE_BASE64.txt
          cat > signing-output/GITHUB_SECRETS.txt <<EOF
          KEYSTORE_PASSWORD=$STORE_PASS
          KEY_ALIAS=arownd
          KEY_PASSWORD=$KEY_PASS
          EOF
          chmod 600 signing-output/arownd-release.jks signing-output/KEYSTORE_BASE64.txt signing-output/GITHUB_SECRETS.txt

      - name: Upload signing package (sensitive)
        uses: actions/upload-artifact@v4
        with:
          name: arownd-android-signing-key
          path: signing-output/
          retention-days: 1
          if-no-files-found: error

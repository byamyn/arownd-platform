name: Main branch checks

on:
  push:
    branches:
      - main
      - arownd-premium
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript, ESLint, Vitest and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 10.9.x has an Arborist peer-dependency resolver bug that can
      # crash with "Cannot read properties of null (reading 'edgesOut')".
      # Keep Node 22 and use a fixed npm release for reproducible CI installs.
      - name: Set up npm 11
        run: |
          npm install --global npm@11.19.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Vercel production build
        # CI-only placeholders validate bundling; never used for a deployment.
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-public-key
        run: npm run build:vercel

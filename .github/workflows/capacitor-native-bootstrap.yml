name: Capacitor native bootstrap
# Native builds are intentionally manual; do not build Android on pushes to main.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capacitor-native-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: capacitor-native-bootstrap-main
  cancel-in-progress: true

jobs:
  generate-and-build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install official Capacitor 8 native plugins
        run: >-
          npm install --save-exact
          @capacitor/geolocation@latest
          @capacitor/camera@latest
          @capacitor/haptics@latest
          @capacitor/network@latest
          @capacitor/keyboard@latest
          @capacitor/preferences@latest

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        id: lint
        run: npm run lint

      - name: Tests
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: npm test

      # Continue the native build after a lint-only failure so APK diagnostics remain available.
      - name: Build local Capacitor web bundle
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: npm run build:capacitor

      - name: Generate Android project when missing
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Register native auth deep links
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: node scripts/configure-capacitor-deeplinks.mjs

      - name: Sync native project
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: npx cap sync android

      - name: Build Android debug APK
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Android APK
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arownd-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated Android project if needed
        if: ${{ success() || steps.lint.outcome == 'failure' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json android
          if git diff --cached --quiet; then
            echo "No generated Android changes."
            exit 0
          fi
          git commit -m "chore(mobile): generate Android project [native-bootstrap]"
          git push origin main

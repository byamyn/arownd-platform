name: Capacitor native bootstrap
# Keep generated native artifacts and the lockfile committed from the current branch head.

on:
  push:
    branches:
      - feat/capacitor-native

permissions:
  contents: write

concurrency:
  group: capacitor-native-bootstrap
  cancel-in-progress: true

jobs:
  generate-and-build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/capacitor-native

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies and refresh lockfile
        run: npm install --no-audit --no-fund

      - name: TypeScript, lint, and tests
        run: |
          npx tsc --noEmit
          npm run lint
          npm test

      - name: Build local Capacitor web bundle
        run: npm run build:capacitor

      - name: Generate Android project when missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android native project already exists; reusing it."
          fi

      - name: Generate iOS project with Swift Package Manager when missing
        run: |
          if [ ! -d ios ]; then
            npx cap add ios --packagemanager SPM
          else
            echo "iOS native project already exists; reusing it."
          fi

      - name: Register native auth deep links
        run: node scripts/configure-capacitor-deeplinks.mjs

      - name: Sync native projects
        run: npx cap sync

      - name: Build Android debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Commit generated native projects and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android ios
          if git diff --cached --quiet; then
            echo "No generated native changes to commit."
            exit 0
          fi
          git commit -m "chore(mobile): generate native projects [native-bootstrap]"
          git push

  build-ios:
    needs: generate-and-build-android
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout generated native project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/capacitor-native

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build local Capacitor web bundle and sync iOS
        run: |
          npm run build:capacitor
          npx cap sync ios

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

name: Capacitor native dependency setup
# Installs and links native plugins only. APK builds are deliberately deferred until app integration is complete.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capacitor-native-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: capacitor-native-bootstrap-main
  cancel-in-progress: true

jobs:
  install-native-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install official Capacitor 8 native plugins
        run: >-
          npm install --save-exact
          @capacitor/geolocation@latest
          @capacitor/camera@latest
          @capacitor/haptics@latest
          @capacitor/network@latest
          @capacitor/keyboard@latest
          @capacitor/preferences@latest
          @capawesome/capacitor-app-update@8.1.1

      - name: Verify Google Play in-app update dependency
        run: npm ls @capawesome/capacitor-app-update

      - name: Build Capacitor web assets (no APK)
        run: npm run build:capacitor

      - name: Sync Capacitor plugins into Android project
        run: npx cap sync android

      - name: Commit native dependency changes if needed
        if: ${{ success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json android
          if git diff --cached --quiet; then
            echo "No generated Android changes."
            exit 0
          fi
          git commit -m "chore(mobile): install Capacitor native plugins"
          git pull --rebase origin main
          git push origin main
